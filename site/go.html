<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#A3002B">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-512.png">
<link rel="apple-touch-icon" href="/icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap">
<link rel="stylesheet" href="/assets/app.css">
<title>ほかのサイトへ移動 | 今日の冬美</title>
</head>
<body>
<main id="main"></main>
<script src="/config.js"></script>
<script src="/assets/common.js"></script>
<script>
(function () {
  const main = document.getElementById("main");
  const to = new URLSearchParams(location.search).get("to") || "";
  if (!F.allowed(to)) {
    main.innerHTML = "<h1>このリンクは開けません</h1><p>今日の冬美のページに戻ってください。</p>";
  } else {
    const label = F.siteLabel(to);
    main.innerHTML = '<h1>' + F.esc(label) + 'のページへ移動します</h1>' +
      '<p>今日の冬美の外のページです。戻るときは、画面の「戻る」を押してください。</p>' +
      '<a class="btn primary" id="go" href="' + F.esc(to) + '">移動する</a>';
  }
  F.backButton(main);
  F.lineBanner(main);
  F.footer();
})();
</script>
</body>
</html>
