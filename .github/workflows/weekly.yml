name: weekly
on:
  schedule:
    - cron: "0 21 * * 6"   # Sunday 06:00 JST
  workflow_dispatch: {}
# Publishing: Cloudflare Pages is connected to this repo and deploys the site/ folder on every push.
permissions:
  contents: write
concurrency:
  group: site
  cancel-in-progress: false
env:
  TZ: Asia/Tokyo
  SITE_URL: ${{ vars.SITE_URL }}
jobs:
  liveness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 pykakasi pyyaml pytest
      - name: Check that videos still exist
        run: python -m pipeline.run weekly
      - name: Commit changes
        run: |
          git config user.name "fuyumi-bot"
          git config user.email "fuyumi-bot@users.noreply.github.com"
          git add -A data site
          if git diff --quiet HEAD -- data site; then echo "no changes"; else git commit -m "data: weekly check $(date +%F)"; git push; fi
