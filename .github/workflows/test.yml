name: test
on:
  push:
    branches-ignore: []
  pull_request: {}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install requests beautifulsoup4 pykakasi pyyaml pytest
      - run: npm install -g playwright@1.47.2 && npx -y playwright@1.47.2 install --with-deps chromium
      - name: All tests (incl. browser checks)
        run: NODE_PATH=$(npm root -g) python -m pytest -q
